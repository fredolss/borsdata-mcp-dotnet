name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Runs on all three OSes: BorsdataMcp.Tests are fast in-process unit tests, while
  # BorsdataMcp.IntegrationTests spawn the real server as a subprocess over stdio (against a local
  # fake Börsdata HTTP server, so no real API key or network access is needed) — the integration
  # suite is what actually needs the OS matrix, and running the unit tests alongside it here avoids
  # a second, duplicated build+test job.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet build
      - run: dotnet test

  # Runs on every push to main / manual dispatch — a convenience build for
  # trying the latest code, not a versioned release. Skipped on tag pushes,
  # which go through the `release` job below instead.
  package:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Stamp manifest version with the commit SHA
        run: |
          sha="${GITHUB_SHA:0:7}"
          echo "sha=$sha" >> "$GITHUB_ENV"
          tmp="$(mktemp)"
          jq --arg v "0.0.0+$sha" '.version = $v' mcpb/manifest.json > "$tmp"
          mv "$tmp" mcpb/manifest.json
          cp mcpb/manifest.json "$RUNNER_TEMP/manifest.base.json"

      - name: Build and pack the portable (framework-dependent) package
        run: |
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -o mcpb/server/app
          (cd mcpb && npx --yes @anthropic-ai/mcpb pack < /dev/null)
          mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${{ env.sha }}-portable.mcpb"

      - name: Build and pack the self-contained linux-x64 package
        run: |
          rm -rf mcpb/server/app
          jq --arg note "Bundled as a self-contained linux-x64 build — no separate .NET runtime installation is required on this machine. " '
            .long_description = ($note + .long_description)
            | .description = "Börsdata financial data (instruments, stock prices, KPIs, reports) via a bundled, self-contained .NET app for Linux (x64) — no separate runtime installation needed. Requires your own Börsdata account with API access."
            | .compatibility.platforms = ["linux"]
            | .server.entry_point = "server/app/BorsdataMcp"
            | .server.mcp_config.command = "${__dirname}/server/app/BorsdataMcp"
            | del(.server.mcp_config.args)
          ' "$RUNNER_TEMP/manifest.base.json" > mcpb/manifest.json
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o mcpb/server/app
          (cd mcpb && npx --yes @anthropic-ai/mcpb pack < /dev/null)
          mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${{ env.sha }}-linux-x64.mcpb"
          cp "$RUNNER_TEMP/manifest.base.json" mcpb/manifest.json

      # Secondary smoke test on top of the `test` job's matrix above: proves the actual
      # self-contained native binary (a different launch path from `dotnet <dll>`, the only one
      # the `test` job's integration suite otherwise exercises) starts and speaks MCP correctly.
      # win-x64's binary isn't smoke-tested here since this job runs on ubuntu-latest, which can't
      # execute it; there's no separate win-x64 runner job to hang this off of.
      - name: Smoke-test the published linux-x64 binary
        run: dotnet test tests/BorsdataMcp.IntegrationTests --filter FullyQualifiedName~McpProtocolTests
        env:
          BORSDATA_MCP_TEST_EXECUTABLE: ${{ github.workspace }}/mcpb/server/app/BorsdataMcp

      - name: Build and pack the self-contained win-x64 package
        run: |
          rm -rf mcpb/server/app
          jq --arg note "Bundled as a self-contained win-x64 build — no separate .NET runtime installation is required on this machine. " '
            .long_description = ($note + .long_description)
            | .description = "Börsdata financial data (instruments, stock prices, KPIs, reports) via a bundled, self-contained .NET app for Windows (x64) — no separate runtime installation needed. Requires your own Börsdata account with API access."
            | .compatibility.platforms = ["win32"]
            | .server.entry_point = "server/app/BorsdataMcp.exe"
            | .server.mcp_config.command = "${__dirname}/server/app/BorsdataMcp.exe"
            | del(.server.mcp_config.args)
          ' "$RUNNER_TEMP/manifest.base.json" > mcpb/manifest.json
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o mcpb/server/app
          (cd mcpb && npx --yes @anthropic-ai/mcpb pack < /dev/null)
          mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${{ env.sha }}-win-x64.mcpb"
          cp "$RUNNER_TEMP/manifest.base.json" mcpb/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: borsdata-mcp-${{ env.sha }}-portable.mcpb
          path: mcpb/borsdata-mcp-${{ env.sha }}-portable.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: borsdata-mcp-${{ env.sha }}-linux-x64.mcpb
          path: mcpb/borsdata-mcp-${{ env.sha }}-linux-x64.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: borsdata-mcp-${{ env.sha }}-win-x64.mcpb
          path: mcpb/borsdata-mcp-${{ env.sha }}-win-x64.mcpb

  # macOS runs as its own job (mirroring `package` above) because building a
  # universal (x64+arm64) binary needs `lipo`, which only exists on macOS —
  # unlike win-x64, this can't be cross-published from the ubuntu-latest
  # runner the other three packages use.
  package-macos:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Stamp manifest version with the commit SHA
        run: |
          sha="${GITHUB_SHA:0:7}"
          echo "sha=$sha" >> "$GITHUB_ENV"
          tmp="$(mktemp)"
          jq --arg v "0.0.0+$sha" '.version = $v' mcpb/manifest.json > "$tmp"
          mv "$tmp" mcpb/manifest.json

      - name: Build and pack the self-contained osx-universal package
        run: |
          jq --arg note "Bundled as a self-contained universal (Intel + Apple Silicon) build — no separate .NET runtime installation is required on this machine. " '
            .long_description = ($note + .long_description)
            | .description = "Börsdata financial data (instruments, stock prices, KPIs, reports) via a bundled, self-contained .NET app for macOS (Intel + Apple Silicon) — no separate runtime installation needed. Requires your own Börsdata account with API access."
            | .compatibility.platforms = ["darwin"]
            | .server.entry_point = "server/app/BorsdataMcp"
            | .server.mcp_config.command = "${__dirname}/server/app/BorsdataMcp"
            | del(.server.mcp_config.args)
          ' mcpb/manifest.json > "$RUNNER_TEMP/manifest.darwin.json"
          mv "$RUNNER_TEMP/manifest.darwin.json" mcpb/manifest.json
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/publish-osx-x64"
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/publish-osx-arm64"
          mkdir -p mcpb/server/app
          lipo -create -output mcpb/server/app/BorsdataMcp "$RUNNER_TEMP/publish-osx-x64/BorsdataMcp" "$RUNNER_TEMP/publish-osx-arm64/BorsdataMcp"
          cp "$RUNNER_TEMP/publish-osx-x64/appsettings.json" mcpb/server/app/appsettings.json
          chmod +x mcpb/server/app/BorsdataMcp
          (cd mcpb && npx --yes @anthropic-ai/mcpb pack < /dev/null)
          mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${{ env.sha }}-osx-universal.mcpb"

      # See the linux-x64 smoke test in `package` above for why this exists.
      - name: Smoke-test the published osx-universal binary
        run: dotnet test tests/BorsdataMcp.IntegrationTests --filter FullyQualifiedName~McpProtocolTests
        env:
          BORSDATA_MCP_TEST_EXECUTABLE: ${{ github.workspace }}/mcpb/server/app/BorsdataMcp

      - uses: actions/upload-artifact@v4
        with:
          name: borsdata-mcp-${{ env.sha }}-osx-universal.mcpb
          path: mcpb/borsdata-mcp-${{ env.sha }}-osx-universal.mcpb

  # Runs only when a `v*` tag is pushed — a deliberate, versioned release.
  # Creates the GitHub Release as a *draft* with the .mcpb packages built here
  # attached; `release-macos` and `release-windows` add their packages to that
  # draft, and `publish-release` makes it public only once every asset is there,
  # so a failed or slow job never leaves a public release missing a platform.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Stamp manifest version from the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp)"
          jq --arg v "$tag_version" '.version = $v' mcpb/manifest.json > "$tmp"
          mv "$tmp" mcpb/manifest.json
          cp mcpb/manifest.json "$RUNNER_TEMP/manifest.base.json"
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Build and pack the portable (framework-dependent) package
        run: |
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -p:Version="$VERSION" -o mcpb/server/app
          (cd mcpb && npx --yes @anthropic-ai/mcpb pack < /dev/null)
          mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${GITHUB_REF_NAME}-portable.mcpb"

      - name: Build and pack the self-contained linux-x64 package
        run: |
          rm -rf mcpb/server/app
          jq --arg note "Bundled as a self-contained linux-x64 build — no separate .NET runtime installation is required on this machine. " '
            .long_description = ($note + .long_description)
            | .description = "Börsdata financial data (instruments, stock prices, KPIs, reports) via a bundled, self-contained .NET app for Linux (x64) — no separate runtime installation needed. Requires your own Börsdata account with API access."
            | .compatibility.platforms = ["linux"]
            | .server.entry_point = "server/app/BorsdataMcp"
            | .server.mcp_config.command = "${__dirname}/server/app/BorsdataMcp"
            | del(.server.mcp_config.args)
          ' "$RUNNER_TEMP/manifest.base.json" > mcpb/manifest.json
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -p:Version="$VERSION" -r linux-x64 --self-contained true -p:PublishSingleFile=true -o mcpb/server/app
          (cd mcpb && npx --yes @anthropic-ai/mcpb pack < /dev/null)
          mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${GITHUB_REF_NAME}-linux-x64.mcpb"
          cp "$RUNNER_TEMP/manifest.base.json" mcpb/manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "mcpb/borsdata-mcp-${GITHUB_REF_NAME}-portable.mcpb" \
            "mcpb/borsdata-mcp-${GITHUB_REF_NAME}-linux-x64.mcpb" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft

  # Builds the macOS universal binary and attaches it to the release created
  # by `release` above — needs both `test` and `release` since the release
  # (and its notes) must already exist before an asset can be uploaded to it.
  # A separate job from `release`, like `package-macos` above, because `lipo`
  # only exists on macOS.
  release-macos:
    needs: [test, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Stamp manifest version from the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp)"
          jq --arg v "$tag_version" '.version = $v' mcpb/manifest.json > "$tmp"
          mv "$tmp" mcpb/manifest.json
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Build and pack the self-contained osx-universal package
        run: |
          jq --arg note "Bundled as a self-contained universal (Intel + Apple Silicon) build — no separate .NET runtime installation is required on this machine. " '
            .long_description = ($note + .long_description)
            | .description = "Börsdata financial data (instruments, stock prices, KPIs, reports) via a bundled, self-contained .NET app for macOS (Intel + Apple Silicon) — no separate runtime installation needed. Requires your own Börsdata account with API access."
            | .compatibility.platforms = ["darwin"]
            | .server.entry_point = "server/app/BorsdataMcp"
            | .server.mcp_config.command = "${__dirname}/server/app/BorsdataMcp"
            | del(.server.mcp_config.args)
          ' mcpb/manifest.json > "$RUNNER_TEMP/manifest.darwin.json"
          mv "$RUNNER_TEMP/manifest.darwin.json" mcpb/manifest.json
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -p:Version="$VERSION" -r osx-x64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/publish-osx-x64"
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -p:Version="$VERSION" -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/publish-osx-arm64"
          mkdir -p mcpb/server/app
          lipo -create -output mcpb/server/app/BorsdataMcp "$RUNNER_TEMP/publish-osx-x64/BorsdataMcp" "$RUNNER_TEMP/publish-osx-arm64/BorsdataMcp"
          cp "$RUNNER_TEMP/publish-osx-x64/appsettings.json" mcpb/server/app/appsettings.json
          chmod +x mcpb/server/app/BorsdataMcp
          (cd mcpb && npx --yes @anthropic-ai/mcpb pack < /dev/null)
          mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${GITHUB_REF_NAME}-osx-universal.mcpb"

      - name: Upload asset to the existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "mcpb/borsdata-mcp-${GITHUB_REF_NAME}-osx-universal.mcpb"

  # Builds the win-x64 package on a GitHub-hosted Windows runner and attaches it
  # to the release created by `release` above. Its own job (rather than a
  # cross-publish from ubuntu-latest like the `package` job does) so that the
  # exact BorsdataMcp.exe that ships can be code-signed once a signing service
  # is set up (Windows Smart App Control blocks the unsigned exe), and so the
  # released exe itself gets smoke-tested on Windows.
  release-windows:
    needs: [test, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    # Raise this (e.g. to 75) when enabling the signing step below, so its
    # wait for manual approval (up to 60 min) doesn't hit the job timeout.
    timeout-minutes: 20
    permissions:
      contents: write
      # Needed by SignPath's action to download the unsigned artifact.
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Stamp manifest version from the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"
          jq --arg v "$tag_version" '.version = $v' mcpb/manifest.json > "$RUNNER_TEMP/manifest.base.json"

      - name: Publish the self-contained win-x64 BorsdataMcp.exe
        run: |
          dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -p:Version="$VERSION" \
            -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$RUNNER_TEMP/publish-win-x64"

      - name: Upload unsigned exe
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: borsdata-mcp-${{ github.ref_name }}-win-x64-unsigned
          path: ${{ runner.temp }}/publish-win-x64/BorsdataMcp.exe
          if-no-files-found: error

      # Not enabled: the SignPath Foundation application (free OSS signing) was
      # declined for now due to limited project visibility; reapply later, or
      # adapt this step for another signing service. To enable: uncomment
      # this step and the "Use the signed exe" step below, add the
      # SIGNPATH_API_TOKEN repository secret, and fill in organization-id /
      # project-slug / signing-policy-slug from the SignPath project. The
      # SignPath artifact configuration should sign the BorsdataMcp.exe at the
      # root of the uploaded artifact.
      # - name: Submit signing request to SignPath
      #   id: signpath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<SIGNPATH_ORGANIZATION_ID>"
      #     project-slug: "borsdata-mcp-dotnet"
      #     signing-policy-slug: "release-signing"
      #     artifact-configuration-slug: "initial"
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     wait-for-completion-timeout-in-seconds: 3600
      #     output-artifact-directory: ${{ runner.temp }}/signed

      # - name: Use the signed exe
      #   run: |
      #     cp "$RUNNER_TEMP/signed/BorsdataMcp.exe" "$RUNNER_TEMP/publish-win-x64/BorsdataMcp.exe"

      - name: Pack the self-contained win-x64 package
        run: |
          jq --arg note "Bundled as a self-contained win-x64 build — no separate .NET runtime installation is required on this machine. " '
            .long_description = ($note + .long_description)
            | .description = "Börsdata financial data (instruments, stock prices, KPIs, reports) via a bundled, self-contained .NET app for Windows (x64) — no separate runtime installation needed. Requires your own Börsdata account with API access."
            | .compatibility.platforms = ["win32"]
            | .server.entry_point = "server/app/BorsdataMcp.exe"
            | .server.mcp_config.command = "${__dirname}/server/app/BorsdataMcp.exe"
            | del(.server.mcp_config.args)
          ' "$RUNNER_TEMP/manifest.base.json" > mcpb/manifest.json
          mkdir -p mcpb/server/app
          cp "$RUNNER_TEMP/publish-win-x64/BorsdataMcp.exe" "$RUNNER_TEMP/publish-win-x64/appsettings.json" mcpb/server/app/
          (cd mcpb && npx --yes @anthropic-ai/mcpb pack < /dev/null)
          mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${GITHUB_REF_NAME}-win-x64.mcpb"

      # Unlike the ubuntu-hosted `package` job, this runner can execute the exe,
      # so smoke-test the exact binary being released.
      - name: Smoke-test the packaged win-x64 binary
        run: dotnet test tests/BorsdataMcp.IntegrationTests --filter FullyQualifiedName~McpProtocolTests
        env:
          BORSDATA_MCP_TEST_EXECUTABLE: ${{ github.workspace }}\mcpb\server\app\BorsdataMcp.exe

      - name: Upload asset to the existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "mcpb/borsdata-mcp-${GITHUB_REF_NAME}-win-x64.mcpb"

  # Makes the draft release created by `release` public, only after every
  # platform's asset job has succeeded. If any of them fails, the release stays
  # a draft (fix and re-run the failed job, then this one runs).
  publish-release:
    needs: [release, release-macos, release-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
