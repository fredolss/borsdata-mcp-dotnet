name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet build
      - run: dotnet test

  # Runs on every push to main / manual dispatch — a convenience build for
  # trying the latest code, not a versioned release. Skipped on tag pushes,
  # which go through the `release` job below instead.
  package:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Stamp manifest version with the commit SHA
        run: |
          sha="${GITHUB_SHA:0:7}"
          echo "sha=$sha" >> "$GITHUB_ENV"
          tmp="$(mktemp)"
          jq --arg v "0.0.0+$sha" '.version = $v' mcpb/manifest.json > "$tmp"
          mv "$tmp" mcpb/manifest.json

      - run: dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -o mcpb/server/app

      - working-directory: mcpb
        run: npx --yes @anthropic-ai/mcpb pack

      - run: mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${{ env.sha }}.mcpb"

      - uses: actions/upload-artifact@v4
        with:
          name: borsdata-mcp-${{ env.sha }}.mcpb
          path: mcpb/borsdata-mcp-${{ env.sha }}.mcpb

  # Runs only when a `v*` tag is pushed — a deliberate, versioned release.
  # Publishes a public GitHub Release with the .mcpb attached.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Stamp manifest version from the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp)"
          jq --arg v "$tag_version" '.version = $v' mcpb/manifest.json > "$tmp"
          mv "$tmp" mcpb/manifest.json

      - run: dotnet publish src/BorsdataMcp/BorsdataMcp.csproj -c Release -o mcpb/server/app

      - working-directory: mcpb
        run: npx --yes @anthropic-ai/mcpb pack

      - run: mv mcpb/mcpb.mcpb "mcpb/borsdata-mcp-${GITHUB_REF_NAME}.mcpb"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "mcpb/borsdata-mcp-${GITHUB_REF_NAME}.mcpb" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
